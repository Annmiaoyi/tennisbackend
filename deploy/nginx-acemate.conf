# =============================================================================
# AceMate 后端 —— Nginx 反向代理（可选）
#
#   安装：
#     sudo cp deploy/nginx-acemate.conf /etc/nginx/sites-available/acemate
#     sudo ln -sf /etc/nginx/sites-available/acemate /etc/nginx/sites-enabled/acemate
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
# 用了它，就把 deploy/acemate.env 里的绑定改回本机：
#     ACEMATE_BIND_HOST=127.0.0.1
#   这样 8787 不再直接对外，外部只能经 Nginx 进来（后面挂 TLS 也方便）。
#
# 不用 Nginx 也能用 —— 直接把后端绑到 0.0.0.0，访问 http://172.20.49.43:8787。
# 局域网自用足够；要上 HTTPS / 对公网开放，就必须走反代。
# =============================================================================

server {
    listen 80;
    # 换成一个真实域名后再加 server_name 域名;
    server_name 172.20.49.43;

    # 采集端会 POST 一整包原始数据（含逐样本波形），默认 1M 会 413
    client_max_body_size 64m;

    # 字体与图片是本地静态资源，开长缓存
    location /assets/fonts/ { proxy_pass http://127.0.0.1:8787; expires 30d; }
    location /assets/img/   { proxy_pass http://127.0.0.1:8787; expires 7d;  }
    # ⚠️ CSS 文件名里没有内容哈希，改了模板重编后必须让浏览器拿到新的，
    #    所以这里缓存要短。等哪天产物名带哈希了再放长。
    location /assets/       { proxy_pass http://127.0.0.1:8787; expires 1h;  }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 单次 push 最多 500 条操作，虽然在一个本地事务里，网络慢时仍会超过 30s
        proxy_read_timeout 60s;

        # 采集上传大包时别让 Nginx 缓冲卡住请求体
        proxy_request_buffering off;
    }
}
